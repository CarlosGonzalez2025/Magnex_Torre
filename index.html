<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    
    <!-- SEO Meta Tags -->
    <title>Torre de Control - Sistema de Gestión de Flotas</title>
    <meta name="description" content="Sistema Central de Gestión de Flotas con monitoreo en tiempo real, alertas inteligentes, inspecciones y análisis de datos." />
    <meta name="keywords" content="flota, vehículos, monitoreo, GPS, alertas, inspecciones, transporte" />
    <meta name="author" content="Torre de Control" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Torre de Control" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Torre de Control" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!--
      Los estilos (Tailwind, Leaflet y los ajustes propios) se compilan en
      index.css y Vite inyecta aquí la hoja resultante, servida desde el propio
      dominio.

      No añadir hojas de estilo ni scripts de CDN externos en este archivo: la
      versión anterior generaba el diseño en el navegador en tiempo de ejecución
      y cualquier bloqueo de red, proxy o extensión dejaba el sistema entero sin
      estilos. La configuración de Tailwind vive ahora en tailwind.config.js.
    -->
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
    
    <!-- Theme initialization script (prevent flash) -->
    <script>
      (function() {
        const saved = localStorage.getItem('torre_control_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      })();
    </script>
  </body>
</html>
