<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — Torre de Control</title>
    <!--
      Página de respaldo del service worker. Es totalmente autónoma (estilos en
      línea, sin peticiones externas) porque debe poder mostrarse justamente
      cuando no hay red. sw.js la precachea durante la instalación.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        width: 100%;
        max-width: 460px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.07);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: #e0f2fe;
        color: #0284c7;
      }
      h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; }
      p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #475569; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #ffffff;
        background: #2563eb;
        border: 0;
        border-radius: 10px;
        padding: 11px 22px;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      .hint { margin: 20px 0 0; font-size: 12px; color: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f1f5f9; }
        .card { background: #1e293b; border-color: #334155; }
        .icon { background: #0c4a6e; color: #7dd3fc; }
        p { color: #94a3b8; }
        .hint { color: #64748b; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 2 20 20" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 13a10 10 0 0 1 5.24-2.76" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>
        No se puede contactar con la Torre de Control. Comprueba tu conexión a
        internet; los datos de flota volverán a cargarse en cuanto se restablezca.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <p class="hint">Esta pantalla se muestra desde la caché del dispositivo.</p>
    </main>
  </body>
</html>
